# Linux only: the container shares the host network stack, so HOST endpoints can use
# real host interfaces and PROCESS-NAME filters can see host processes.
# Usage: docker compose -f docker-compose.host.yml up -d --build
name: proximity

services:
  proximity:
    image: proximity
    build:
      context: .
      args:
        VERSION: ${PROXIMITY_VERSION:-1.0.0}
    container_name: proximity
    restart: unless-stopped
    init: true
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun
    environment:
      PROXIMITY_ADMIN_USER: ${PROXIMITY_ADMIN_USER:-}
      PROXIMITY_ADMIN_PASSWORD: ${PROXIMITY_ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${PROXIMITY_CONFIG_DIR:-${HOME}/.config/proximity}:/config
