# Linux: the container shares the host network stack and routes all outgoing
# connections of the host through Proximity (transparent mode).
# macOS and Windows: use docker-compose.bridge.yml (scripts/proximity.sh picks it).
name: proximity

services:
  proximity:
    image: proximity
    build:
      context: .
      args:
        VERSION: ${PROXIMITY_VERSION:-1.1.0}
    container_name: proximity
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    network_mode: host
    pid: host
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    devices:
      - /dev/net/tun
    environment:
      PROXIMITY_NETWORK: host
      PROXIMITY_LISTEN: ${PROXIMITY_UI_BIND:-0.0.0.0}:8899
      PROXIMITY_PROXY_BIND: ${PROXIMITY_PROXY_BIND:-127.0.0.1}
      PROXIMITY_ADMIN_USER: ${PROXIMITY_ADMIN_USER:-}
      PROXIMITY_ADMIN_PASSWORD: ${PROXIMITY_ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${PROXIMITY_CONFIG_DIR:-${HOME}/.config/proximity}:/config
